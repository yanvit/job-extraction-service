# ДЗ2, крок 4: evals RAG на кожен push і pull request. Падає, якщо метрика нижче порогу (evals/config.yaml).
#
# Що потрібно один раз: Settings → Secrets and variables → Actions → New repository secret ANTHROPIC_API_KEY.
# Відповіді моделей кешуються в evals/cache/ (у git): поки промпт, модель, питання й знайдений контекст
# не змінились, прогін не викликає API і нічого не коштує. Змінили — платимо лише за змінені пункти.
name: evals

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      # Довідкові документи захищені авторським правом і не лежать у git — завантажуємо за manifest.
      # Виняток — закон (public domain): він у git, бо zakon.rada.gov.ua недоступний з runner-а; fetch його пропускає.
      - name: Cache reference documents
        uses: actions/cache@v4
        with:
          path: data/docs
          key: docs-${{ hashFiles('data/sources/manifest.yaml') }}

      - name: Cache embedding / reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('rag/config.yaml') }}

      - name: Unit tests for scoring functions
        run: python -m pytest evals/test_scoring.py -q

      - name: Corpus → chunks → index
        run: |
          make corpus
          make chunks
          make index

      - name: Retrieval eval (recall@k, MRR)
        run: make eval-retrieval

      - name: RAG evals (deterministic + LLM judge + faithfulness) with thresholds
        run: make evals

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            data/processed/chunking_comparison.md
