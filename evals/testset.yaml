# Тестсет RAG (ДЗ2, крок 4): питання, очікувані відповіді, джерела.
#
# category:
#   answerable — відповідь є в корпусі;
#   trap       — відповідь є, але поруч схожий документ або застаріла версія з іншою відповіддю;
#   no_answer  — відповіді в корпусі немає → очікуємо status=not_found («у документах цього немає»).
#
# expected   — еталонна відповідь для LLM-судді (своїми словами, з цифрами).
# key_facts  — детермінована перевірка: кожна група — список рівноцінних варіантів, у відповіді має бути хоч один.
# sources    — doc_id, з яких відповідь можна взяти; у цитатах має бути хоча б один.
# must_not   — рядки, яких у відповіді бути не повинно (типова помилка пастки).
# evidence   — дослівна фраза з документа, на якій тримається відповідь (для ручної перевірки).
#
# Як складали: питання й відповіді написано з Claude за текстами документів. Кожну evidence знайдено
# grep-ом у data/processed/chunks.jsonl, а для кожного питання шукали ту саму фразу в інших документах.
reviewed_by: Vitalii

