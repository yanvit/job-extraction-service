# Налаштування індексу й пошуку (ДЗ2, крок 2)
paths:
  chunks: data/processed/chunks.jsonl            # structure-aware
  chunks_fixed: data/processed/chunks_fixed.jsonl # базова лінія для порівняння
  index_dir: data/index                          # Qdrant (локальний режим) + кеш ембеддингів

embeddings:
  model: intfloat/multilingual-e5-small          # 384-вимірні вектори, UA/EN, швидко на CPU
  query_prefix: "query: "                        # e5 очікує префікси query:/passage:
  passage_prefix: "passage: "
  batch_size: 32

bm25:
  k1: 1.5
  b: 0.75

fusion:
  method: rrf          # Reciprocal Rank Fusion: score = Σ 1 / (k + rank)
  k: 60
  candidates: 30       # скільки кандидатів брати з кожного пошуку перед об'єднанням

rerank:
  model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1   # мультимовний cross-encoder
  top_n: 20            # скільки кандидатів після fusion переоцінювати

answer:                # ДЗ2, крок 3: RAG з джерелами
  model: claude-haiku-5-5        # id з кореневого config.yaml (ціни, structured output)
  prompt: v1                     # prompts/rag/<version>/
  retrieve_mode: hybrid_rerank
  retrieve_k: 8                  # кандидатів після rerank; у контекст ідуть, скільки влізе в бюджет
  context_budget_tokens: 2500    # бюджет на джерела (≈ 5–7 чанків structure-aware по ~350 токенів)
  min_rerank_score: 1.5          # «не знаю» до виклику моделі: найкращий чанк нижче порогу → not_found
                                 # (на 15 питаннях з відповіддю мінімум 2.88; поза темою < −2; суміжні 0–1.1)
  min_source_score: -2.0         # слабші за це чанки не беремо в контекст, навіть якщо бюджет є
  max_tokens: 4096               # Haiku 5.5 спершу думає (thinking), і ці токени теж ідуть з max_tokens: на 1024 складне питання обрізалось
